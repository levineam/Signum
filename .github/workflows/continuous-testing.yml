name: Continuous Testing

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch: # Manual trigger

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # LINT & TYPE CHECK
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @tailwindcss/oxide lightningcss

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @tailwindcss/oxide lightningcss

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage (if available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

  # ============================================================================
  # BUILD VERIFICATION
  # ============================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @tailwindcss/oxide lightningcss

      - name: Build project
        run: npm run build
        env:
          # Add any required build env vars here
          NODE_ENV: production

  # ============================================================================
  # E2E SMOKE TESTS (PR only, non-forks)
  # ============================================================================
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on PRs from non-forked repos (secrets available)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @tailwindcss/oxide lightningcss

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run smoke tests
        run: npm run test:e2e:smoke
        env:
          CI: true
          # Mock OpenAI API in CI
          OPENAI_MOCK: "1"
          # Add other env vars as needed
          # SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  # ============================================================================
  # E2E FULL SUITE (Main branch push only)
  # ============================================================================
  e2e-full:
    name: E2E Full Suite (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on push to dev/main branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @tailwindcss/oxide lightningcss

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run full E2E test suite
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true
          OPENAI_MOCK: "1"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  # ============================================================================
  # BURN-IN LOOP (Weekly + on-demand)
  # ============================================================================
  burn-in:
    name: Flaky Test Detection (10 iterations)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on workflow_dispatch or scheduled runs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @tailwindcss/oxide lightningcss

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run burn-in loop (10 iterations)
        run: |
          echo "🔥 Starting burn-in loop to detect flaky tests..."

          for i in {1..10}; do
            echo ""
            echo "═══════════════════════════════════════════════"
            echo "🔥 Burn-in iteration $i/10"
            echo "═══════════════════════════════════════════════"

            npm run test:e2e:smoke || {
              echo "❌ Test failure detected in iteration $i"
              exit 1
            }
          done

          echo ""
          echo "✅ All 10 burn-in iterations passed!"
          echo "Tests are stable and non-flaky."
        env:
          CI: true
          OPENAI_MOCK: "1"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Report burn-in failure
        if: failure()
        run: |
          echo "❌ FLAKY TESTS DETECTED!"
          echo "Tests failed during burn-in loop."
          echo "Review test-results artifacts to identify flaky tests."
          exit 1

# Optional: Schedule weekly burn-in runs
# Uncomment to enable scheduled flaky test detection
# on:
#   schedule:
#     # Run every Sunday at 2 AM UTC
#     - cron: '0 2 * * 0'
