name: Codex Review Request

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  request-codex-review:
    name: Post '@codex review' comment
    runs-on: ubuntu-latest
    steps:
      - name: Comment to request Codex review
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No pull_request in payload.');
              return;
            }

            const body = '@codex review';

            // Get the latest commit timestamp
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 1,
              page: 1,
            });

            if (!commits.data.length) {
              core.info('No commits found in PR.');
              return;
            }

            const latestCommitDate = new Date(commits.data[commits.data.length - 1].commit.committer.date);
            core.info(`Latest commit date: ${latestCommitDate.toISOString()}`);

            // Get existing comments
            const existing = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              }
            );

            // Check if bot already commented AFTER the latest commit
            const alreadyRequested = existing.some((comment) => {
              const isBot = comment.user?.type === 'Bot' && comment.user?.login === 'github-actions[bot]';
              const matchesBody = comment.body?.trim() === body;
              const commentDate = new Date(comment.created_at);
              const isAfterLatestCommit = commentDate > latestCommitDate;

              if (isBot && matchesBody) {
                core.info(`Found bot comment at ${commentDate.toISOString()}, after latest commit: ${isAfterLatestCommit}`);
              }

              return isBot && matchesBody && isAfterLatestCommit;
            });

            if (alreadyRequested) {
              core.info('Codex review already requested after latest commit; skipping duplicate comment.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
