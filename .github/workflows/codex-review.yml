name: Codex Review Request

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  request-codex-review:
    name: Post '@codex review' comment
    runs-on: ubuntu-latest
    steps:
      - name: Comment to request Codex review
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No pull_request in payload.');
              return;
            }
            const body = '@codex review';
            const existing = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              }
            );
            const alreadyRequested = existing.some((comment) => {
              const isBot = comment.user?.type === 'Bot' && comment.user?.login === 'github-actions[bot]';
              const matchesBody = comment.body?.trim() === body;
              return isBot && matchesBody;
            });
            if (alreadyRequested) {
              core.info('Codex review already requested; skipping duplicate comment.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
